name: Jarvis Open Source Task
on:
  push:
    branches: [main]
    paths: [.github/workflows/jarvis-open-source.yml]
  schedule:
    - cron: '0 5 * * *' # Approximately 07:00 South Africa, daily
  workflow_dispatch:
    inputs:
      report:
        description: Report to prepare
        type: choice
        options: [task, morning]
        default: task
        required: true
      execution:
        description: Where Jarvis runs
        type: choice
        options:
          - cloud
          - local
        default: cloud
        required: true
      task:
        description: Fashion business task for Jarvis (no private customer data)
        required: true
        default: Prepare three tasks to rebuild Bonga Bhengu fashion visibility.
permissions:
  contents: read
  id-token: write
concurrency:
  group: jarvis-open-source-task
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ${{ inputs.execution == 'local' && fromJSON('["self-hosted","Windows","jarvis"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install local open source inference
        if: inputs.execution != 'local'
        run: curl -fsSL https://ollama.com/install.sh -o /tmp/install-ollama.sh && sh /tmp/install-ollama.sh
      - name: Start local model service
        if: inputs.execution != 'local'
        run: |
          ollama serve > /tmp/ollama.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/tags > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Download bounded model
        run: ollama pull qwen3:1.7b
      - name: Collect morning fashion and social evidence
        if: github.event_name == 'schedule' || github.event_name == 'push' || inputs.report == 'morning'
        run: python bonga-platform/jarvis/morning_report.py --output jarvis-local-report.md
      - name: Produce reviewed task draft
        if: github.event_name == 'workflow_dispatch' && inputs.report != 'morning'
        env:
          JARVIS_TASK: ${{ inputs.task }}
        run: python bonga-platform/jarvis/local_runner.py --output jarvis-local-report.md
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-local-report
          path: jarvis-local-report.md
          retention-days: 1
      - name: Send report to Bonga Bhengu dashboard
        run: python bonga-platform/jarvis/send_cloud_report.py

